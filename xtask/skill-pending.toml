# Skill checks that `xtask skill-check` registers but a later story implements.
#
# Schema: one `[[check]]` table per pending check, with exactly these keys:
#   name  = the check's name; the only known check is "component-entries"
#   story = "<epic>.<story>" of the story that implements it
#
# `component-entries` (every component builder has its own entry in the Usage
# Skill) must stay listed until it is implemented; it fails as due once the
# public API snapshot exports a component builder type. Story 4.1 removes this
# entry when it implements the check.

[[check]]
name = "component-entries"
story = "4.1"
