# Turkish. Missing keys fall back to en-US.yaml with a build warning (LOC-04).

# Command names are translated word by word (cmdword.*); a full-path key overrides it.
cmdword:
  setup: kurulum
  start: başlat
  dashboard: panel
  profile: profil
  bio: biyografi
  join: katıl
  leave: ayrıl
  play: çal
  skip: geç
  stop: durdur

cmd:
  setup:
    description: Botu bu sunucu için kur
    start:
      description: Botu bu sunucu için adım adım yapılandır
  dashboard:
    description: Sunucu panelini aç
    opt:
      module:
        name: modül
        description: Bir modülün ayarlarına git
  profile:
    description: Bir üyenin profil kartını göster
    opt:
      user:
        name: kullanıcı
        description: Kimin profili gösterilsin (varsayılan sensin)
  bio:
    description: Profil biyografini düzenle
  badge:
    description: Bir rozet göster
    opt:
      name:
        name: ad
        description: Rozet adı
  join:
    description: Bir ses kanalına katıl
    opt:
      channel:
        name: kanal
        description: Katılınacak ses veya sahne kanalı
  leave:
    description: Ses kanalından ayrıl
  play:
    description: Bir medya bağlantısını sıraya ekle; gerekirse önce ses kanalına katılır
    opt:
      url:
        name: bağlantı
        description: Bir http(s) ses veya video bağlantısı
  skip:
    description: Çalan parçayı geç
  stop:
    description: Çalmayı durdur ve sırayı temizle

ctxcmd:
  show_profile:
    name: Profili göster

common:
  guild_only: Bu yalnızca bir sunucuda çalışır.
  refresh: Yenile
  enabled: açık
