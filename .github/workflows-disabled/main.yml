name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Benches against crates/noctis-core/benches/budgets.toml (AD-25, AD-28).
  # Since Story 14.3 every table gates (`gate = true`): an over-budget metric
  # exits 1 and fails the job; an invalid run exits 2 and fails it too.
  benches:
    name: Benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # `cargo bench` has no --release: the bench profile inherits release.
      # Story 14.3: dispatch latency p99 at 10 000 events/s (NFR-3) on a
      # 4-worker runtime; GitHub's ubuntu-latest runner has 4 vCPUs.
      - run: cargo bench -p noctis-core --bench dispatch_latency
      # Story 12.6: memory per idle guild (NFR-1).
      - run: cargo bench -p noctis-core --bench memory_per_guild
      # Story 10.11: the reference card render latency (NFR-3).
      - run: cargo bench -p noctis-image --features render --bench reference_card

  # Story 10.11 (NFR-8, AD-28): builds and tests against the newest takumi
  # and takumi-core. Report-only: it never fails the workflow; each step's
  # result goes to the job summary.
  latest-takumi:
    name: Latest takumi (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/latest-takumi.sh
