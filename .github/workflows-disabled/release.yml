name: Release

# The release pipeline (FR-48, NFR-7, NFR-8, AD-28; Story 14.7). Runbook:
# docs/guides/release.md. Configuration: release-plz.toml (guarded by
# `cargo run --release -p xtask -- release-check`).
#
# Every push to `main` runs both jobs:
# - `release-pr` opens or updates the `chore: release` PR while CHANGELOG.md
#   has no heading for the current version (the PR only stamps it). It never
#   sees the crates.io token.
# - `release` publishes, in the protected `release` environment, only when the
#   merged commit is a release PR (`release_always = false`); otherwise
#   release-plz releases nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: Release PR
    if: github.repository == 'ErdemGKSL/noctis-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: release-plz/action@v0.5.146
        with:
          version: 0.4.1
          command: release-pr
        env:
          # Only the repository token: no crates.io token in this job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    if: github.repository == 'ErdemGKSL/noctis-rs'
    runs-on: ubuntu-latest
    # The only job with the crates.io token (environment secret, `main` only).
    environment: release
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release
      cancel-in-progress: false
    # crates.io accepts 5 new crates at once, then 1 per 10 minutes; the 13
    # first publishes take about 90 minutes with the retries below.
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.1
      - uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
      # A rerun skips the crates already on crates.io, so a rate-limited
      # attempt resumes where it stopped (12 attempts, 11 minutes apart).
      - run: bash .github/scripts/release-retry.sh 12 660 -- release-plz release --git-token "$GITHUB_TOKEN" --forge github
