name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an older run; only the latest commit's
# run decides whether main is green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-config:
    name: Build config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/check-build-config.sh
      # Checks that the template's dependency graph and the facade feature names
      # it uses resolve, without compiling (template-build compiles and tests it).
      - run: cargo metadata --format-version 1 --manifest-path examples/project-template/Cargo.toml > /dev/null

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace
      # The i18n TestApp suites (App and Module catalogs, command localization) need both `i18n`
      # and `testkit`, which no single-feature run enables.
      - run: cargo test --release -p noctis --features i18n,testkit --test i18n_app --test i18n_modules --test i18n_locales --test i18n_commands --test i18n_overlays
      # Needs both `image` and `testkit` (Story 10.3: `ctx.render` end to end).
      - run: cargo test --release -p noctis --features image,testkit --test render_e2e
      # Needs both `image` and `testkit` (Story 15.1: the Renderer seam).
      - run: cargo test --release -p noctis --features image,testkit --test renderer_seam
      # The reference card bench in smoke mode (Story 10.11): percentile and budget
      # parser self-checks, budgets.toml, three distinct renders.
      - run: cargo test --release -p noctis-image --features render --bench reference_card
      # Needs both `prefix` and `testkit` (Story 15.4: prefix commands end to end).
      - run: cargo test --release -p noctis --features prefix,testkit --test prefix_e2e

  allocation:
    name: Allocation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Zero-allocation guard of fixed-width inline decode (AD-25, NFR-9).
      - run: cargo test --release -p noctis-codec --test alloc_decode
      # Zero-allocation guard of component dispatch: Route lookup by borrowed
      # key plus fixed-width decode, over 10 and 10 000 Routes (Story 7.1).
      - run: cargo test --release -p noctis --test alloc_dispatch
      # Exact heap-block pins of the event pipeline, push to handler start
      # (Story 16.3).
      - run: cargo test --release -p noctis-core --test pipeline_alloc
      # The per-interaction budget (Story 14.3, NFR-9): exact block pins push
      # to handler start, at most one RefStore call, one boxed handler future.
      - run: cargo test --release -p noctis-core --test interaction_alloc

  each-feature:
    name: Test each feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6
      - run: cargo hack test --release --workspace --each-feature

  # The final feature matrix (Story 14.7): `each-feature` above, plus every
  # feature at once here (what docs.rs builds). libwebp and libopus need a C
  # compiler and cmake.
  all-features:
    name: Build and test all features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --all-features
      - run: cargo test --release --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20
      - run: cargo deny check

  msrv:
    name: MSRV 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.91 --profile minimal
      - run: cargo +1.91 check --release --workspace

  deps-check:
    name: Deps check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- deps-check
      # AD-15, AD-30: default `noctis` pulls no takumi, Songbird, image, voice,
      # prefix or testkit crate.
      - run: bash .github/scripts/check-default-graph.sh

  # FR-48, NFR-7 (Story 14.7): every noctis crate packages and builds from its
  # .crate file in dependency order. A dry run needs no crates.io token: this
  # job never sees CARGO_REGISTRY_TOKEN (only release.yml's `release` job does).
  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run --locked

  # NFR-8, AD-28: the facade's API against the latest `noctis` on crates.io,
  # every feature on; skipped until the first release is published.
  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51
      - run: bash .github/scripts/semver-check.sh

  # The release invariants offline (Story 14.7): published crates, their
  # dependency edges, release-plz.toml and the CHANGELOG.md header; plus the
  # crates.io rate-limit retry of release.yml.
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- release-check
      - run: bash .github/scripts/release-retry-test.sh

  # Required on every push, takumi bumps included (NFR-8, AD-28): the grammar
  # fingerprint, the takumi oracle and the reference card pixel snapshot.
  tw-crosscheck:
    name: Takumi cross-check and pixel snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- tw-grammar --check
      - run: cargo test --release -p noctis-image --features render --test tw_crosscheck
      # CI=true: a missing snapshot fails instead of being written.
      - run: cargo test --release -p noctis --features image,testkit --test reference_card

  rules-catalog:
    name: Rules catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- rules-catalog

  api-snapshot:
    name: API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The only nightly use: cargo public-api reads rustdoc JSON (format 61).
      - run: rustup toolchain install nightly-2026-10-15 --profile minimal
      - run: cargo install cargo-public-api --version 0.52.0 --locked
      - run: cargo run --release -p xtask -- api-snapshot

  skill-check:
    name: Skill check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- skill-check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    # FR-74: the facade's rustdoc builds without warnings with default and with all
    # features (what docs.rs builds), its doctests pass, and docs-check finds no broken
    # link, anchor or same-repo URL, no unlinked guide and no `ignore` doctest. It never
    # fetches a URL. `--all-features` needs a C compiler and cmake (libwebp, libopus).
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --release -p noctis --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --release -p noctis --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --release -p noctis --all-features --doc
      - run: cargo run --release -p xtask -- docs-check

  template-build:
    name: Project template build
    runs-on: ubuntu-latest
    # Required: the template builds, lints and passes its tests (flows, the pixel
    # snapshot, the adapter conformance test) against this repo's `noctis`. Its
    # Cargo.lock is committed, so every step is `--locked`; GitHub sets `CI=true`, so a
    # missing or changed insta / pixel snapshot fails instead of being written.
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/project-template
      - run: cargo fmt --check
        working-directory: examples/project-template
      - run: cargo build --release --locked
        working-directory: examples/project-template
      - run: cargo clippy --release --locked --all-targets -- -D warnings
        working-directory: examples/project-template
      # `--all-features` adds `prefix` and `voice` (Story 17.1): libopus needs a C
      # compiler and cmake.
      - run: cargo clippy --release --locked --all-targets --all-features -- -D warnings
        working-directory: examples/project-template
      - run: cargo test --release --locked
        working-directory: examples/project-template
      # `--all-features`: libopus needs a C compiler and cmake (see above).
      - run: cargo test --release --locked --all-features
        working-directory: examples/project-template
