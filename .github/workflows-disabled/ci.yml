name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an older run; only the latest commit's
# run decides whether main is green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-config:
    name: Build config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/check-build-config.sh
      # Checks that the template's dependency graph and the facade feature names
      # it uses resolve, without compiling (template-build stays tracking-only).
      - run: cargo metadata --format-version 1 --manifest-path examples/project-template/Cargo.toml > /dev/null

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace
      # The i18n TestApp suites (App and Module catalogs, command localization) need both `i18n`
      # and `testkit`, which no single-feature run enables.
      - run: cargo test --release -p noctis --features i18n,testkit --test i18n_app --test i18n_modules --test i18n_locales --test i18n_commands --test i18n_overlays
      # Needs both `image` and `testkit` (Story 10.3: `ctx.render` end to end).
      - run: cargo test --release -p noctis --features image,testkit --test render_e2e
      # Needs both `image` and `testkit` (Story 15.1: the Renderer seam).
      - run: cargo test --release -p noctis --features image,testkit --test renderer_seam
      # The reference card bench in smoke mode (Story 10.11): percentile and budget
      # parser self-checks, budgets.toml, three distinct renders.
      - run: cargo test --release -p noctis-image --features render --bench reference_card
      # Needs both `prefix` and `testkit` (Story 15.4: prefix commands end to end).
      - run: cargo test --release -p noctis --features prefix,testkit --test prefix_e2e

  allocation:
    name: Allocation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Zero-allocation guard of fixed-width inline decode (AD-25, NFR-9).
      - run: cargo test --release -p noctis-codec --test alloc_decode
      # Zero-allocation guard of component dispatch: Route lookup by borrowed
      # key plus fixed-width decode, over 10 and 10 000 Routes (Story 7.1).
      - run: cargo test --release -p noctis --test alloc_dispatch

  each-feature:
    name: Test each feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6
      - run: cargo hack test --release --workspace --each-feature

  all-features:
    name: Build all features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20
      - run: cargo deny check

  msrv:
    name: MSRV 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.91 --profile minimal
      - run: cargo +1.91 check --release --workspace

  deps-check:
    name: Deps check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- deps-check
      # AD-30: the default facade graph never contains Songbird.
      - name: No songbird in the default graph
        run: |
          if cargo tree -p noctis -e normal --prefix none | grep -q '^songbird '; then
            echo "songbird is in noctis's default dependency graph" >&2
            exit 1
          fi

  # Required on every push, takumi bumps included (NFR-8, AD-28): the grammar
  # fingerprint, the takumi oracle and the reference card pixel snapshot.
  tw-crosscheck:
    name: Takumi cross-check and pixel snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- tw-grammar --check
      - run: cargo test --release -p noctis-image --features render --test tw_crosscheck
      # CI=true: a missing snapshot fails instead of being written.
      - run: cargo test --release -p noctis --features image,testkit --test reference_card

  rules-catalog:
    name: Rules catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- rules-catalog

  api-snapshot:
    name: API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The only nightly use: cargo public-api reads rustdoc JSON (format 61).
      - run: rustup toolchain install nightly-2026-10-15 --profile minimal
      - run: cargo install cargo-public-api --version 0.52.0 --locked
      - run: cargo run --release -p xtask -- api-snapshot

  skill-check:
    name: Skill check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- skill-check

  template-build:
    name: Project template build
    runs-on: ubuntu-latest
    # Tracking mode until Story 14.2: the template uses API that has not landed yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
        working-directory: examples/project-template
      # The `voice` feature (Story 17.1): libopus needs a C compiler and cmake.
      - run: cargo build --release --features voice
        working-directory: examples/project-template
      - run: cargo test --release --features voice
        working-directory: examples/project-template
