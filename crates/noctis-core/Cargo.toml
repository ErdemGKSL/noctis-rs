[package]
name = "noctis-core"
description = "Runtime core for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobenches = false

[dependencies]
arc-swap.workspace = true
brotli-decompressor.workspace = true
bytes.workspace = true
futures-util.workspace = true
getrandom.workspace = true
h2.workspace = true
hickory-resolver.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
metrics.workspace = true
noctis-codec.workspace = true
noctis-gateway.workspace = true
noctis-i18n.workspace = true
noctis-ports.workspace = true
noctis-rules.workspace = true
noctis-ui.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = { workspace = true, features = ["all"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["logging", "tls12", "ring"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
twilight-http.workspace = true
twilight-model.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
metrics-util = { workspace = true, features = ["debugging"] }
noctis = { workspace = true, features = ["testkit"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
toml.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[[bench]]
name = "dispatch_latency"
path = "benches/dispatch_latency/main.rs"
harness = false
test = true

[[bench]]
name = "memory_per_guild"
path = "benches/memory_per_guild/main.rs"
harness = false

[[bench]]
name = "pipeline"
path = "benches/pipeline.rs"
harness = false

[[test]]
name = "interaction_alloc"
path = "tests/interaction_alloc.rs"
harness = false

[[test]]
name = "pipeline_alloc"
path = "tests/pipeline_alloc.rs"
harness = false

[lints]
workspace = true
