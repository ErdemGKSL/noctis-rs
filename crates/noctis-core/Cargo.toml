[package]
name = "noctis-core"
description = "Runtime core for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
metrics.workspace = true
noctis-gateway.workspace = true
noctis-ports.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
twilight-http.workspace = true
twilight-model.workspace = true

[dev-dependencies]
bytes.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[lints]
workspace = true
