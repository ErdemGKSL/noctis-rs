[package]
name = "noctis-core"
description = "Runtime core for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
futures-util.workspace = true
getrandom.workspace = true
h2.workspace = true
hickory-resolver.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
metrics.workspace = true
noctis-gateway.workspace = true
noctis-i18n.workspace = true
noctis-ports.workspace = true
noctis-rules.workspace = true
noctis-ui.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde_json.workspace = true
socket2 = { workspace = true, features = ["all"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["logging", "tls12", "ring"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
twilight-http.workspace = true
twilight-model.workspace = true

[dev-dependencies]
metrics-util = { workspace = true, features = ["debugging"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[lints]
workspace = true
