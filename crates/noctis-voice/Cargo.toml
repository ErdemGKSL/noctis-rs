[package]
name = "noctis-voice"
description = "Voice for Noctis. Internal; use `noctis` (feature `voice`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
metrics.workspace = true
noctis-core.workspace = true
noctis-gateway.workspace = true
reqwest.workspace = true
songbird.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
twilight-model.workspace = true

[features]
# The recording driver (`VoiceConfig::recording`, `VoiceRecorder`) for bot
# tests; only the facade's `testkit` feature turns it on (AD-30).
testkit = []
# Every demux format by default; the facade's `voice` turns them all on.
default = ["ogg", "mkv", "mp3", "aac", "isomp4", "flac", "wav"]
ogg = ["symphonia/ogg"]
mkv = ["symphonia/mkv"]
mp3 = ["symphonia/mp3"]
aac = ["symphonia/aac"]
isomp4 = ["symphonia/isomp4"]
flac = ["symphonia/flac"]
wav = ["symphonia/wav", "symphonia/pcm"]

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
dhat.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
# Path-only: cargo publish strips it (noctis depends on this crate).
noctis = { path = "../noctis", features = ["testkit", "voice"] }
noctis-testkit.workspace = true
serde_json.workspace = true
# `internals` (Songbird's mock mixer and scheduler) for the frame-counting
# tests, the allocation test and the bench only; never a normal feature
# (AD-30, deps-check `songbird-gated`).
songbird = { workspace = true, features = ["internals"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }

[[bench]]
name = "voice"
harness = false

[[test]]
name = "passthrough_alloc"
harness = false

[lints]
workspace = true
