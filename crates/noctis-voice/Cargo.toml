[package]
name = "noctis-voice"
description = "Voice for Noctis. Internal; use `noctis` (feature `voice`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
metrics.workspace = true
noctis-core.workspace = true
noctis-gateway.workspace = true
reqwest.workspace = true
songbird.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
twilight-model.workspace = true

[features]
# Every demux format by default; the facade's `voice` turns them all on.
default = ["ogg", "mkv", "mp3", "aac", "isomp4", "flac", "wav"]
ogg = ["symphonia/ogg"]
mkv = ["symphonia/mkv"]
mp3 = ["symphonia/mp3"]
aac = ["symphonia/aac"]
isomp4 = ["symphonia/isomp4"]
flac = ["symphonia/flac"]
wav = ["symphonia/wav", "symphonia/pcm"]

[dev-dependencies]
metrics-util = { workspace = true, features = ["debugging"] }
noctis = { workspace = true, features = ["testkit", "voice"] }
noctis-testkit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
