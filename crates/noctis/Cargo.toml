[package]
name = "noctis"
description = "Discord bot framework on twilight: sharding, Components V2 UI kit, image rendering."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Image rendering through takumi (noctis-image `render`); off by default.
image = []
# GIF/APNG output for rendered images.
image-gif = []
# Twemoji colour emoji in image Templates.
image-emoji = []
# Bundled default font for image Templates.
default-font = []
# Localization runtime (noctis-i18n).
i18n = []
# Opt-in prefix commands (noctis-prefix, P2).
prefix = []
# Test kit (noctis-testkit); enable it in `[dev-dependencies]` only.
testkit = []

[dependencies]
bytes.workspace = true
noctis-codec.workspace = true
noctis-macros.workspace = true
noctis-ports.workspace = true
noctis-rules.workspace = true
noctis-ui.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
trybuild.workspace = true
twilight-model.workspace = true

[lints]
workspace = true
