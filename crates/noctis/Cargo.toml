[package]
name = "noctis"
description = "Discord bot framework on twilight: sharding, Components V2 UI kit, image rendering."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The test theme of the facade's own tests and doctests.
exclude = ["noctis-theme.css"]

[features]
default = []
# Image Templates: `#[derive(Template)]`, `view!`/`tw!`/`theme!`, the takumi
# Renderer and its render pool (noctis-image `render`); off by default. Needs a
# C compiler: the WebP encoder (libwebp) is built from source.
image = ["dep:noctis-image", "noctis-image/render", "noctis-macros/image"]
# GIF/APNG output for rendered images (implies `image`); without it a Template
# declaring `Gif`/`Apng` is a compile error.
image-gif = ["image", "noctis-image/gif"]
# Twemoji colour emoji in image Templates.
image-emoji = []
# Bundles Inter 4.1 (OFL-1.1) as the last-resort font of image Templates
# (implies `image`).
default-font = ["image", "noctis-image/default-font"]
# Localization runtime (noctis-i18n).
i18n = ["noctis-macros/i18n"]
# Opt-in prefix commands (noctis-prefix, P2).
prefix = []
# Test kit (noctis-testkit); enable it in `[dev-dependencies]` only.
testkit = ["dep:noctis-testkit"]

[dependencies]
bytes.workspace = true
noctis-codec.workspace = true
noctis-core.workspace = true
noctis-i18n.workspace = true
noctis-image = { workspace = true, optional = true }
noctis-macros.workspace = true
noctis-ports.workspace = true
noctis-rules.workspace = true
noctis-testkit = { workspace = true, optional = true }
noctis-ui.workspace = true
twilight-http.workspace = true
twilight-model.workspace = true

[dev-dependencies]
blake3.workspace = true
dhat.workspace = true
insta = { workspace = true, features = ["json"] }
png.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util"] }
trybuild.workspace = true

[lints]
workspace = true
