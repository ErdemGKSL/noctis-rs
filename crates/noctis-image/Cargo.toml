[package]
name = "noctis-image"
description = "Image rendering for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Adds the node tree, `TemplateView`, the runtime class check, the takumi
# Renderer, the rayon render pool and `ImagePlugin` (the noctis-core edge).
render = [
  "dep:takumi",
  "dep:takumi-core",
  "dep:noctis-ports",
  "dep:noctis-core",
  "dep:tracing",
  "dep:rayon",
  "dep:tokio",
  "dep:bytes",
  "dep:image",
]
# GIF and APNG output (the facade's `image-gif`). takumi-raster always links
# its GIF/PNG encoders, so this gates Noctis code only.
gif = ["render"]

[dependencies]
# `tw` and `tw::theme` (takumi-free, ungated): the theme parser and its digest.
blake3.workspace = true
bytes = { workspace = true, optional = true }
cssparser.workspace = true
# `render`: resamples rendered frames for the size budget's size steps.
image = { workspace = true, optional = true }
noctis-core = { workspace = true, optional = true }
noctis-ports = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
# `rayon`: takumi's internal parallelism runs on whichever pool executes the
# job, which is the render pool.
takumi = { workspace = true, optional = true, features = ["raster-backend", "rayon"] }
takumi-core = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["sync"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
png.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
