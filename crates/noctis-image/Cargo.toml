[package]
name = "noctis-image"
description = "Image rendering for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Adds the node tree, `TemplateView`, the runtime class check and the takumi
# renderer (the noctis-core and -ui edges follow in Story 10.3).
render = ["dep:takumi", "dep:takumi-core", "dep:noctis-ports", "dep:tracing"]

[dependencies]
# `tw` and `tw::theme` (takumi-free, ungated): the theme parser and its digest.
blake3.workspace = true
cssparser.workspace = true
noctis-ports = { workspace = true, optional = true }
takumi = { workspace = true, optional = true, features = ["raster-backend"] }
takumi-core = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true

[lints]
workspace = true
