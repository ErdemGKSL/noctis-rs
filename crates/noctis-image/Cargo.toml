[package]
name = "noctis-image"
description = "Image rendering for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Adds the takumi renderer (Story 10.1 wires the crates; the noctis-core,
# -ports and -ui edges follow in Story 10.3).
render = ["dep:takumi", "dep:takumi-core"]

[dependencies]
takumi = { workspace = true, optional = true, features = ["raster-backend"] }
takumi-core = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true
