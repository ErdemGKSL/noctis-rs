[package]
name = "noctis-gateway"
description = "Gateway sharding for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
futures-util.workspace = true
noctis-ports.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
tokio-websockets = { workspace = true, features = ["client", "fastrand", "sha1_smol", "rustls-platform-verifier"] }
twilight-gateway.workspace = true
twilight-model.workspace = true

[dev-dependencies]
rustls.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
