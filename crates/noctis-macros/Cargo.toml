[package]
name = "noctis-macros"
description = "Proc macros for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[features]
default = []
# `#[derive(Template)]`, `view!`, `tw!` and `theme!` (noctis-image's `tw`
# module only; its `render` feature stays off).
image = ["dep:noctis-image"]

[dependencies]
noctis-image = { workspace = true, optional = true }
noctis-rules.workspace = true
proc-macro2.workspace = true
yaml-rust2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }
unicode-ident.workspace = true

[lints]
workspace = true
