[package]
name = "noctis-testkit"
description = "Test kit for Noctis. Internal; use `noctis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
dhat.workspace = true
futures-util = { workspace = true, features = ["sink"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server-auto", "tokio"] }
noctis-core.workspace = true
# The `Renderer` port of pixel snapshots (never noctis-image, AD-24).
noctis-ports.workspace = true
noctis-rules.workspace = true
noctis-ui.workspace = true
# Decodes pixel snapshots (stored and rendered PNGs).
png.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-websockets = { workspace = true, features = ["server", "sha1_smol"] }
twilight-model.workspace = true

[dev-dependencies]
bytes.workspace = true
insta = { workspace = true, features = ["json"] }
metrics.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
noctis.workspace = true
noctis-gateway.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-websockets = { workspace = true, features = ["client", "server", "sha1_smol"] }
twilight-gateway.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[lints]
workspace = true
